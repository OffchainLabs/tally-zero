name: Delegate Profile Registration
description: Register or update your delegate profile so it appears on tally-zero.
title: "[Delegate] <display name or address>"
labels: ["delegate-registration"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to register or update your delegate profile.

        All fields except the wallet address are optional, but a statement and
        social links help delegators understand who they are entrusting their
        voting power to.

  - type: input
    id: address
    attributes:
      label: Delegate Address
      description: The Ethereum address that holds your delegated voting power (0x...).
      placeholder: "0x0000000000000000000000000000000000000000"
    validations:
      required: true

  - type: input
    id: display-name
    attributes:
      label: Display Name
      description: Name shown at the top of your profile. Leave blank to fall back to ENS or your shortened address.
      placeholder: e.g. Alice Delegate
    validations:
      required: false

  - type: input
    id: ens
    attributes:
      label: ENS Name
      description: Your ENS name, if you have one.
      placeholder: alice.eth
    validations:
      required: false

  - type: textarea
    id: bio
    attributes:
      label: Short Bio
      description: A one or two sentence introduction shown under your name.
      placeholder: Independent governance contributor focused on protocol security.
    validations:
      required: false

  - type: input
    id: picture
    attributes:
      label: Profile Picture URL
      description: Direct link to a square image (https only). Leave blank to use the default avatar.
      placeholder: https://example.com/avatar.png
    validations:
      required: false

  - type: input
    id: twitter
    attributes:
      label: Twitter / X Handle
      description: Username only, without the leading @.
      placeholder: alicedelegate
    validations:
      required: false

  - type: textarea
    id: statement-summary
    attributes:
      label: Statement Summary
      description: A short summary shown above your full delegate statement.
      placeholder: One paragraph that captures your governance philosophy.
    validations:
      required: false

  - type: textarea
    id: statement
    attributes:
      label: Delegate Statement
      description: Your full delegate statement. Markdown is supported (headings, lists, links, bold, italic).
      placeholder: |
        ## Background
        ...

        ## Voting Principles
        ...

        ## Conflicts of Interest
        ...
    validations:
      required: false

  - type: dropdown
    id: seeking-delegation
    attributes:
      label: Seeking Delegation
      description: Should the "Seeking Delegation" badge appear on your profile?
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I control the wallet address listed above and authorize this profile to be displayed on tally-zero.
          required: true
        - label: The information I have provided is accurate to the best of my knowledge.
          required: true
